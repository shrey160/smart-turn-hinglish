[project]
name = "hinglish-turn"
version = "0.1.0"
description = "Hinglish turn detection model (Shiprocket challenge) - built on Pipecat Smart Turn v3.2 reference"
readme = "context/references/Hinglish-Turn-Detection-Playbook.md"
requires-python = ">=3.11,<3.12"

dependencies = [
    "datasets[audio]>=3.0",
    "huggingface-hub>=0.26",
    "soundfile>=0.12",
    "librosa>=0.10",
    "numpy<2.2",
    "pandas>=2.0",
    "tqdm>=4.66",
    "python-dotenv>=1.0",
    "transformers>=5.16.1",
    "torchaudio>=2.11.0",
    "onnx>=1.22.0",
    "onnxruntime>=1.29.0",
    "edge-tts>=7.2.8",
]

[tool.uv]
package = false
